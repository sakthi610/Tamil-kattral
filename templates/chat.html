{% extends "base.html" %}
{% block title %}AI சந்தேக நீக்கும் சாட்போட் – TNPSC{% endblock %}
{% block styles %}
<style>
  .chatwrap {
    background:#fffaf2; border-radius:20px; overflow:hidden;
    box-shadow:0 14px 40px rgba(0,0,0,.25); display:flex; flex-direction:column;
    height:74vh; min-height:480px;
  }
  .chathdr { background:linear-gradient(135deg,#a41212,#d9480f); color:#fff; padding:13px 16px; display:flex; align-items:center; gap:11px; }
  .chathdr .av { width:40px; height:40px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-size:21px; }
  .chathdr h1 { font-size:16.5px; font-weight:700; }
  .chathdr p { font-size:12px; opacity:.92; }
  .dot { display:inline-block; width:7px; height:7px; background:#4ade80; border-radius:50%; margin-right:5px; animation:blink 1.5s infinite; }
  @keyframes blink { 50% { opacity:.4; } }
  #chat { flex:1; overflow-y:auto; padding:15px 14px; display:flex; flex-direction:column; gap:10px; background:#fffaf2; }
  .msg { max-width:84%; padding:11px 14px; border-radius:16px; font-size:14.8px; line-height:1.7; white-space:pre-wrap; word-wrap:break-word; }
  .bot { background:#fff; border:1px solid #f0d9c0; border-bottom-left-radius:4px; align-self:flex-start; color:#3b2a20; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .user { background:linear-gradient(135deg,#c2410c,#ea580c); color:#fff; border-bottom-right-radius:4px; align-self:flex-end; }
  .typing { background:#fff; border:1px solid #f0d9c0; padding:14px 18px; border-radius:16px; align-self:flex-start; display:flex; gap:5px; }
  .typing span { width:8px; height:8px; background:#c2410c; border-radius:50%; animation:bounce 1.2s infinite; }
  .typing span:nth-child(2){ animation-delay:.15s; } .typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce { 0%,60%,100%{ transform:translateY(0);} 30%{ transform:translateY(-7px);} }
  .chips { display:flex; gap:8px; padding:8px 14px; flex-wrap:wrap; background:#fffaf2; border-top:1px solid #f5e5d3; }
  .chip { background:#fff; border:1.5px solid #ea580c; color:#c2410c; padding:6px 13px; border-radius:20px; font-size:13px; cursor:pointer; font-family:inherit; font-weight:500; transition:.2s; }
  .chip:hover { background:#ea580c; color:#fff; }
  .inputbar { display:flex; gap:8px; padding:11px 14px 14px; background:#fffaf2; align-items:center; border-top:1px solid #f5e5d3; }
  #msg { flex:1; border:2px solid #f0d9c0; border-radius:24px; padding:11px 16px; font-size:14.8px; font-family:inherit; outline:none; background:#fff; color:#333; }
  #msg:focus { border-color:#ea580c; }
  .btn { width:46px; height:46px; border-radius:50%; border:none; cursor:pointer; font-size:19px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:.2s; }
  #send { background:linear-gradient(135deg,#c2410c,#ea580c); color:#fff; }
  #send:hover { transform:scale(1.07); }
  #send:disabled { opacity:.5; cursor:wait; transform:none; }
  #mic { background:#fff; border:2px solid #f0d9c0; }
  #mic.listening { background:#fee2e2; border-color:#ef4444; animation:blink 1s infinite; }
</style>
{% endblock %}
{% block content %}
<div class="chatwrap">
  <div class="chathdr">
    <div class="av">🤖</div>
    <div>
      <h1>AI சந்தேக நீக்கும் ஆசிரியர்</h1>
      <p><span class="dot"></span>Sarvam AI • TNPSC பாடத்திட்டம் அறிந்தவர் • ஆன்லைன்</p>
    </div>
  </div>

  <div id="chat"></div>

  <div class="chips">
    <button class="chip" onclick="quick('வணக்கம்! நீ யார்?')">👋 அறிமுகம்</button>
    <button class="chip" onclick="quick('திருக்குறளின் முக்கியக் கருத்துகள் என்ன?')">📜 திருக்குறள்</button>
    <button class="chip" onclick="quick('இந்திய அரசியலமைப்பின் அடிப்படைக் கூறுகள் சொல்லுங்கள்')">⚖️ ஆட்சியியல்</button>
    <button class="chip" onclick="quick('சுயமரியாதை இயக்கம் பற்றி விளக்குங்கள்')">✊ சுயமரியாதை இயக்கம்</button>
    <button class="chip" onclick="quick('HCF மற்றும் LCM எப்படி கணக்கிடுவது?')">🧮 திறனறிவு</button>
    <button class="chip" onclick="randomKural()">🎲 சரிபார்க்கப்பட்ட குறள்</button>
  </div>

  <div class="inputbar">
    <button class="btn" id="mic" title="குரலில் பேசுங்கள்">🎤</button>
    <input id="msg" placeholder="தமிழில் உங்கள் சந்தேகத்தைக் கேளுங்கள்..." autocomplete="off">
    <button class="btn" id="send" title="அனுப்பு">➤</button>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('msg');
const sendBtn = document.getElementById('send');
const micBtn = document.getElementById('mic');
let history = [];

function addMsg(text, who) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
function showTyping() {
  const d = document.createElement('div');
  d.className = 'typing'; d.id = 'typing';
  d.innerHTML = '<span></span><span></span><span></span>';
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}
function hideTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }

async function send(text) {
  text = (text === undefined ? input.value : text).trim();
  if (!text) return;
  input.value = '';
  addMsg(text, 'user');
  history.push({role:'user', content:text});
  showTyping();
  sendBtn.disabled = true;
  try {
    const res = await fetch('/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message:text, history:history.slice(0,-1)})
    });
    const data = await res.json();
    hideTyping();
    if (data.reply) {
      addMsg(data.reply, 'bot');
      history.push({role:'assistant', content:data.reply});
    } else {
      addMsg('⚠️ ' + (data.error || 'பிழை ஏற்பட்டது. மீண்டும் முயற்சிக்கவும்.'), 'bot');
    }
  } catch(e) {
    hideTyping();
    addMsg('⚠️ இணைய பிழை. மீண்டும் முயற்சிக்கவும்.', 'bot');
  }
  sendBtn.disabled = false;
  input.focus();
}
function quick(t) { send(t); }

async function randomKural() {
  try {
    const r = await fetch('/api/kural/random');
    const k = await r.json();
    if (k.error) { addMsg('⚠️ ' + k.error, 'bot'); return; }
    const txt = '📖 குறள் ' + k.number + ' — ' + k.adhigaram + ' (' + k.paal + ')\n\n'
      + k.line1 + '\n' + k.line2
      + (k.meaning_sp ? '\n\n💬 ' + k.meaning_sp : '');
    addMsg(txt, 'bot');
  } catch(e) { addMsg('⚠️ குறள் ஏற்றுவதில் பிழை.', 'bot'); }
}
sendBtn.onclick = () => send();
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

let rec = null;
micBtn.onclick = () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('உங்கள் browser-ல் குரல் வசதி இல்லை. Chrome பயன்படுத்தவும்.'); return; }
  if (rec) { rec.stop(); rec = null; micBtn.classList.remove('listening'); return; }
  rec = new SR();
  rec.lang = 'ta-IN';
  rec.interimResults = false;
  micBtn.classList.add('listening');
  rec.onresult = e => { const t = e.results[0][0].transcript; input.value = t; send(t); };
  rec.onend = () => { rec = null; micBtn.classList.remove('listening'); };
  rec.onerror = () => { rec = null; micBtn.classList.remove('listening'); };
  rec.start();
};

window.onload = () => {
  addMsg('வணக்கம்! 🙏 நான் உங்கள் TNPSC குரூப் 2/2A சந்தேகத் தீர்வு ஆசிரியர். பாடத்திட்டத்தில் எந்த அலகு சார்ந்த கேள்வியும் தமிழில் கேளுங்கள்!', 'bot');
  input.focus();
};
</script>
{% endblock %}
